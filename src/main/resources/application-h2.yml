# ============================================================================
# 本地 H2 调试环境 — 端口 8080，文件库 ./data/crm
# ============================================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:h2:file:./data/crm;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false

logging:
  level:
    com.brother.crm: DEBUG
