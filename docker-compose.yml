services:
  crm-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-api:0.1.0
    container_name: crm-api
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - /project/server/crm/crm.env
    # 优雅停机：Docker 发 SIGTERM，Spring 等 20s 处理完存量请求
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/api/auth/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 日志轮转：单文件 50M，保留 5 份
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
